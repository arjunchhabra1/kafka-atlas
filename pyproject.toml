[project]
name = "kgrag"
version = "0.1.0"
description = "Kafka Atlas: knowledge-graph RAG over the Kafka mailing lists"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.2",
  "neo4j>=5.20",
  "tiktoken>=0.7",
  "typer>=0.12",
  "langfuse>=3,<4",
  "langchain>=0.3",
  "httpx>=0.28.1",
  "tenacity>=9.2.1",
  "anthropic>=1.15.0",
  "langchain-anthropic>=1.7.6",
  "rich>=15.0.0",
  "numpy>=2.5.4",
  "langchain-postgres>=0.0.19",
  "langchain-voyageai>=0.4.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.23.1",
    "testcontainers>=4.8",
]

[project.scripts]
kgrag = "kgrag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kgrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' --import-mode=importlib"
markers = [
  "integration: needs Docker (testcontainers)",
  "quality: quality/eval tests, non-blocking",
  "live: calls live external APIs; never run by default",
]
